<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chorklist</title>
  <meta name="theme-color" content="#2a9d8f">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1><img src="icon.svg" alt="" width="28" height="28"> Chorklist</h1>
    <label class="me">
      <span>I'm</span>
      <select id="me-select" aria-label="Who is using Chorklist"></select>
    </label>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="chores" aria-selected="true">Chores</button>
    <button role="tab" data-tab="history" aria-selected="false">History</button>
    <button role="tab" data-tab="household" aria-selected="false">Household</button>
  </nav>

  <main>
    <section id="tab-chores" class="tab-panel">
      <div class="toolbar">
        <select id="filter-select" aria-label="Filter chores by person"></select>
        <button id="add-chore-btn" class="primary">+ Add chore</button>
      </div>
      <div id="chore-groups"></div>
    </section>

    <section id="tab-history" class="tab-panel" hidden>
      <ul id="history-list" class="history"></ul>
    </section>

    <section id="tab-household" class="tab-panel" hidden>
      <form id="member-form" class="inline-form">
        <input id="member-name" placeholder="Add a household member" maxlength="40" required>
        <button class="primary">Add</button>
      </form>
      <ul id="member-list" class="members"></ul>
    </section>
  </main>

  <dialog id="chore-dialog">
    <form id="chore-form" method="dialog">
      <h2 id="chore-dialog-title">Add chore</h2>
      <label>Chore
        <input name="name" required maxlength="80" placeholder="e.g. Clean the bathroom">
      </label>
      <label>Room / area
        <input name="room" maxlength="40" placeholder="e.g. Kitchen" list="room-options">
        <datalist id="room-options"></datalist>
      </label>
      <fieldset class="row">
        <legend>Repeats</legend>
        <span>Every</span>
        <input name="every" type="number" min="1" max="365" value="1" required aria-label="Interval">
        <select name="unit" aria-label="Unit">
          <option value="day">day(s)</option>
          <option value="week" selected>week(s)</option>
          <option value="month">month(s)</option>
          <option value="year">year(s)</option>
        </select>
      </fieldset>
      <label>First due
        <input name="startDate" type="date" required>
      </label>
      <label>Assigned to
        <select name="assigneeId"></select>
      </label>
      <label class="check">
        <input name="rotate" type="checkbox">
        Rotate between household members after each completion
      </label>
      <label>Notes
        <textarea name="notes" rows="2" maxlength="500"></textarea>
      </label>
      <p class="form-error" id="chore-error" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" id="delete-chore-btn" class="danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" value="cancel" id="cancel-chore-btn">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
